name: Queue Seva CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: "22"

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Install main project dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
        env:
          # Prisma generate validates URL shape only. No DB connection needed.
          DATABASE_URL: "postgresql://placeholder:placeholder@localhost:5432/placeholder?schema=public"
      - name: Lint
        run: npm run lint
      - name: Type check main project
        run: npm run typecheck
      - name: Install socket service dependencies
        working-directory: mini-services/socket-service
        run: npm ci
      - name: Type check socket service
        working-directory: mini-services/socket-service
        run: npm run typecheck
      - name: Build socket service
        working-directory: mini-services/socket-service
        run: npm run build

  build:
    name: Build (Next.js)
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    env:
      DATABASE_URL: "postgresql://placeholder:placeholder@localhost:5432/placeholder?schema=public"
      JWT_SECRET: "ci-build-secret-key-not-for-production"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npx prisma generate
      - run: npm run build
      - name: Verify standalone artifacts
        run: |
          test -f .next/standalone/server.js
          test -d .next/standalone/.next/static
          test -d .next/standalone/public

  docker-build:
    name: Docker Build (smoke)
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build app image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: queue-seva-app:ci
          build-args: |
            JWT_SECRET=ci-build-secret-key-not-for-production
            NEXT_PUBLIC_GOOGLE_CLIENT_ID=
            NEXT_PUBLIC_SOCKET_URL=
      - name: Build socket-service image (no push)
        uses: docker/build-push-action@v6
        with:
          context: ./mini-services/socket-service
          file: ./mini-services/socket-service/SocketDockerfile
          push: false
          load: true
          tags: queue-seva-socket:ci
